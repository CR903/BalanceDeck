<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>皮肤外观 × 进度语义（2x 等比）</title>
<style>
  body { margin:0; background:#0c0c0e; color:#f2f2f7; font-family:-apple-system,'PingFang SC',system-ui,sans-serif; padding:28px; }
  h1 { font-size:19px; margin:0 0 4px; }
  .hint { color:#98989f; font-size:12.5px; max-width:940px; line-height:1.7; }
  .sec { margin-top:22px; max-width:980px; background:#141417; border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:18px 20px; }
  .sec h2 { font-size:14px; margin:0 0 2px; }
  .sec .src { font-size:11.5px; color:#98989f; margin-bottom:14px; }
  .balls { display:flex; gap:26px; flex-wrap:wrap; }
  .bcell { text-align:center; }
  .bcell .lab { font-size:11.5px; color:#c9c9d1; margin-top:10px; }
  .bcell .lab small { display:block; color:#8a8a93; font-size:10.5px; margin-top:2px; }
  .stage { width:112px; height:112px; position:relative; margin:0 auto; }
  .ball { position:absolute; inset:0; border-radius:50%; overflow:hidden; }
  .reading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.08; text-shadow:0 1px 3px rgba(0,0,0,.45); }
  .reading b { font-size:26px; font-weight:800; }
  .reading span { font-size:12px; font-weight:600; opacity:.75; margin-top:4px; letter-spacing:.06em; }
  .reading b.amt { font-size:19px; }
  svg.ring { position:absolute; inset:0; width:112px; height:112px; }
  .v { font-size:12px; line-height:1.7; padding:8px 12px; border-radius:8px; margin-top:14px; }
  .okv { background:rgba(48,209,88,.12); color:#b9f2c6; }
  .wrn { background:rgba(255,159,10,.12); color:#ffd9a0; }
  .v1 { background:radial-gradient(circle at 50% 35%, #3a2415, #17100a 72%); box-shadow:inset 0 0 0 1.5px rgba(255,159,10,.35); }
  .v1 .ticks { position:absolute; inset:4px; border-radius:50%;
    background:repeating-conic-gradient(from 0deg, rgba(255,159,10,.85) 0deg 2deg, transparent 2deg 15deg);
    -webkit-mask:radial-gradient(circle, transparent 40px, #000 42px, #000 48px, transparent 50px);
    mask:radial-gradient(circle, transparent 40px, #000 42px, #000 48px, transparent 50px); }
  .v1 .reading b, .v1 .reading span { color:#fff; }
  .v3 { background:radial-gradient(circle at 50% 40%, #0e3a22 0%, #07180f 70%); }
  .v3 .reading b { color:#fff; } .v3 .reading span { color:#9fe8c1; }
  .v5 { background:radial-gradient(circle at 50% 40%, #1d2b12 0%, #0b0f07 70%); }
  .v5 .reading b { color:#fff; }
  .v6 { background:#0b1626; }
  /* 圆形裁剪内的波浪水面：水体再高也撑不方球形；顶光+内缘做出参考图的立体感 */
  .v6 .wclip { position:absolute; inset:0; border-radius:50%; overflow:hidden; }
  .v6 .water { position:absolute; left:0; right:0; bottom:0; }
  .v6 .wsurf { position:absolute; top:-13px; left:0; width:100%; height:26px; }
  .v6 .gloss { position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle at 32% 15%, rgba(255,255,255,.45), rgba(255,255,255,0) 34%); }
  .v6 .rim { position:absolute; inset:0; border-radius:50%; pointer-events:none;
    box-shadow:inset 0 0 0 2px rgba(140,190,255,.35), inset 0 8px 16px rgba(255,255,255,.16), inset 0 -14px 24px rgba(0,20,60,.55); }
  .v6 .reading b { color:#fff; }
  /* V7 · 墨底琥珀弧（ink 改造方向）：深墨蓝底 + 琥珀身份弧 + 弧开口两端白色端点圆点。
     底色立体层仍走全皮肤通用的 .ball::after（不另叠压暗，否则深底被二次压黑）。 */
  .v7 { background:radial-gradient(circle at 50% 40%, #18243f 0%, #080c17 70%); }
  .v7 .reading b, .v7 .reading span { color:#fff; }
/* —— 全皮肤球通用立体层（::after 盖在最上，玻璃罩即视感；读数不受影响，渐变中心透明） —— */
  .ball { box-shadow:0 8px 22px rgba(0,0,0,.55); }
  .ball::after { content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle at 32% 15%, rgba(255,255,255,.38), rgba(255,255,255,0) 32%),
               radial-gradient(circle at 50% 126%, rgba(0,0,0,.58), rgba(0,0,0,0) 55%);
    box-shadow:inset 0 2px 5px rgba(255,255,255,.3), inset 0 -15px 24px rgba(0,0,0,.52), inset 0 0 26px rgba(0,0,0,.38); }
/* —— 隐藏柱（2x：24×112，屏边温度计；液高=用量/满柱=余额，液色=等级色，槽色=皮肤） —— */
  .col { width:24px; height:112px; border-radius:12px; position:relative; overflow:hidden; margin:0 auto;
    box-shadow:0 6px 16px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.12); }
  .cfill { position:absolute; left:0; right:0; bottom:0; }
  .cfill::before { content:''; position:absolute; top:-6px; left:0; width:100%; height:12px; border-radius:50%; background:inherit; }
  .cticks { position:absolute; inset:0; pointer-events:none; opacity:.6;
    background-image:linear-gradient(var(--tick),var(--tick)),linear-gradient(var(--tick),var(--tick)),linear-gradient(var(--tick),var(--tick));
    background-size:100% 2px; background-position:50% 25%, 50% 50%, 50% 75%; background-repeat:no-repeat; }
  .cgloss { position:absolute; inset:0; border-radius:12px; pointer-events:none;
    background:linear-gradient(90deg, rgba(255,255,255,.38), rgba(255,255,255,0) 38%, rgba(255,255,255,0) 68%, rgba(0,0,0,.42)),
               linear-gradient(to bottom, rgba(255,255,255,.22), rgba(255,255,255,0) 30%);
    box-shadow:inset 0 -10px 16px rgba(0,0,0,.35); }
/* —— morph 动效 demo（球左、柱右；隐藏≈530ms / 唤出≈400ms，与真机时序同数量级） —— */
  .mstage { width:320px; height:150px; position:relative; margin:6px auto 0; }
  .mstage .mball { position:absolute; left:10px; top:19px; width:112px; height:112px; }
  .mstage .mcol { position:absolute; right:10px; top:19px; margin:0; transform:scale(0); opacity:0; }
  .mbtns { text-align:center; margin-top:8px; }
  .mbtns button { background:#2a2a2e; color:#fff; border:1px solid rgba(255,255,255,.16); border-radius:999px;
    padding:7px 18px; font-size:12.5px; margin:0 6px; cursor:pointer; }
  .mbtns button:active { transform:scale(.95); }
/* —— A · 柱顶浪常驻：液顶一层行进波 + 柱内液光流（振幅/速度逐款不同） —— */
  .acol .cfill::before { display:none; }
  .cwave { position:absolute; top:-9px; left:0; width:48px; height:18px;
    animation-name:cdrift; animation-timing-function:linear; animation-iteration-count:infinite; }
  @keyframes cdrift { from { transform:translateX(0); } to { transform:translateX(-24px); } }
  .cshim { position:absolute; left:3px; right:3px; height:26px; pointer-events:none;
    background:linear-gradient(to bottom,transparent,rgba(255,255,255,.26),transparent);
    animation-name:shimove; animation-timing-function:ease-in-out;
    animation-iteration-count:infinite; animation-direction:alternate; }
  @keyframes shimove { from { top:6%; } to { top:52%; } }
/* —— D · 悬停 peek：柱上冒 112px 完整波浪球（波浪+雨滴+读数），不唤出 —— */
  .pcol { position:relative; }
  .peek { position:absolute; bottom:124px; left:50%; z-index:5; pointer-events:none;
    transform:translateX(-50%) translateY(8px) scale(.7); opacity:0;
    transition:transform 180ms ease-out, opacity 180ms ease-out; }
  .pcol.on .peek { transform:translateX(-50%) translateY(0) scale(1); opacity:1; }
  .pk-ball { width:112px; height:112px; border-radius:50%; position:relative; overflow:hidden;
    background:#0b1626;
    box-shadow:0 10px 26px rgba(0,0,0,.6), inset 0 0 0 2px rgba(140,190,255,.3); }
  .pk-ball::after { content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle at 32% 15%, rgba(255,255,255,.4), rgba(255,255,255,0) 34%);
    box-shadow:inset 0 -14px 22px rgba(0,0,0,.5); }
  .pk-water { position:absolute; left:0; right:0; bottom:0; height:70%;
    background:linear-gradient(to bottom,#ff9f0ae6,#ff9f0a 45%,#ff9f0a99); }
  .pk-water svg { position:absolute; top:-8px; left:0; width:224px; height:16px; }
  .pk-w1 { animation:pkdrift 2.2s linear infinite; }
  .pk-w2 { animation:pkdrift 3.4s linear infinite reverse; opacity:.5; }
  @keyframes pkdrift { from { transform:translateX(0); } to { transform:translateX(-112px); } }
  .pk-drops i { position:absolute; top:-14px; width:5px; height:11px; border-radius:50%;
    background:#7cc4ff; opacity:0; animation:pkfall 1.6s ease-in infinite; }
  .pk-drops i:nth-child(1) { left:30px; animation-delay:0s; }
  .pk-drops i:nth-child(2) { left:55px; animation-delay:.5s; }
  .pk-drops i:nth-child(3) { left:78px; animation-delay:1s; }
  @keyframes pkfall { 0% { transform:translateY(0); opacity:0; } 15% { opacity:1; }
    70% { transform:translateY(76px); opacity:1; } 100% { transform:translateY(84px); opacity:0; } }
  .pk-read { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:800; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5); }
/* —— 化浪 listes：球柱之间的行进波带 + 堆柱水花 —— */
  .mwave { position:absolute; left:118px; top:62px; width:150px; height:36px; overflow:hidden;
    opacity:0; transform:scaleX(0); transform-origin:left center; }
  .mwave svg { width:200%; height:100%; display:block; }
  .mwave.flow svg { animation:waveflow 550ms linear infinite; }
  @keyframes waveflow { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  .mping { position:absolute; left:50%; top:30%; width:20px; height:8px; margin:-4px 0 0 -10px;
    border-radius:50%; border:2px solid rgba(255,255,255,.8); opacity:0; pointer-events:none; }
</style>
</head>
<body>
<h1>皮肤外观 × 进度语义（2x 等比，112px = 56px×2）</h1>
<p class="hint">横向=语义（41% ok / 78% warn / 92% danger / 余额满格+金额），纵向=皮肤。环弧长度=进度，环弧/水体颜色=等级色（ok #30d158 / warn #ff9f0a / danger #ff453a），余额统一满格 + accent 色 + 金额读数。</p>
<div id="app"></div>
<script>
var LVL = { ok:'#30d158', warn:'#ff9f0a', danger:'#ff453a' };
function lvlOf(p){ return p>=85 ? 'danger' : p>=60 ? 'warn' : 'ok'; }
/* 双层浪：深色后浪压浅色前浪，无白线（白线与读数重叠，拿掉只留深浅两层） */
function waveSvg(col){
  return '<svg class="wsurf" viewBox="0 0 112 26" preserveAspectRatio="none">'
    + '<path d="M0,10 Q14,2 28,10 T56,10 T84,10 T112,10 V18 H0 Z" fill="rgba(0,15,50,.42)"/>'
    + '<path d="M0,17 Q14,9 28,17 T56,17 T84,17 T112,17 V26 H0 Z" fill="'+col+'"/></svg>';
}
function arc(r, pct, color, sw, track){
  var C = 2*Math.PI*r, len = Math.max(0.1,(C*pct/100)).toFixed(1);
  return '<svg class="ring" viewBox="0 0 112 112">'
    + '<circle cx="56" cy="56" r="'+r+'" fill="none" stroke="'+track+'" stroke-width="'+sw+'"/>'
    + '<circle cx="56" cy="56" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw
    + '" stroke-linecap="round" stroke-dasharray="'+len+' '+C.toFixed(1)+'" transform="rotate(-90 56 56)"/></svg>';
}
function reading(main, sub, amt){
  return '<div class="reading"><b class="'+(amt?'amt':'')+'">'+main+'</b><span>'+sub+'</span></div>';
}
// state: {pct} 或 {bal:'¥1288'}
function ball(skin, st){
  var isBal = !!st.bal, pct = isBal ? 100 : st.pct, lv = lvlOf(pct);
  var col = isBal ? skin.accent : LVL[lv];
  var main = isBal ? st.bal : pct+'%', sub = isBal ? '余额' : (st.tag || '用量');
  var inner = '';
  if (skin.id==='v1'){
    inner = '<div class="ticks"></div>' + arc(44, pct, col, 8, 'rgba(255,159,10,.22)') + reading(main, sub, isBal);
  } else if (skin.id==='v3'){
    inner = arc(48, pct, col, 5, 'rgba(34,181,115,.22)')
      + '<svg class="ring" viewBox="0 0 112 112"><circle cx="56" cy="56" r="38" fill="none" stroke="rgba(34,181,115,.16)" stroke-width="3"/></svg>'
      + reading(main, sub, isBal);
  } else if (skin.id==='v5'){
    var C = 2*Math.PI*42;
    inner = '<svg class="ring" viewBox="0 0 112 112">'
      + '<circle cx="56" cy="56" r="42" fill="none" stroke="rgba(190,255,60,.22)" stroke-width="12"/>'
      + '<circle cx="56" cy="56" r="42" fill="none" stroke="'+col+'" stroke-width="12" stroke-dasharray="60 16 60 16 60 220" opacity="0.35" transform="rotate(-90 56 56)"/>'
      + '<circle cx="56" cy="56" r="42" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="butt" stroke-dasharray="'+Math.max(0.1,(C*pct/100)).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 56 56)"/></svg>'
      + reading(main, sub, isBal);
  } else if (skin.id==='v6'){
    var h = pct.toFixed(0);
    inner = '<div class="wclip"><div class="water" style="height:'+h+'%;background:linear-gradient(to bottom,'+col+'e6,'+col+' 45%,'+col+'99)">'
      + waveSvg(col) + '</div></div>'
      + '<div class="gloss"></div><div class="rim"></div>'
      + reading(main, sub, isBal);
  } else if (skin.id==='v7'){
    /* 弧色走等级色（col），轨道是琥珀身份色；端点圆点固定白色，位置 = 12 点起算
       与 pct 同角度，故末端点用 rotate(pct*3.6) 绕圆心转（112 坐标：圆心 56,56，r=44
       → 12 点在 cy=12）。r=44 与 V1 的刻度圈同心，端点圆点半径 4 ≈ 线宽 6 的 2/3。 */
    var C7 = 2*Math.PI*44, deg7 = (pct*3.6).toFixed(1);
    inner = '<svg class="ring" viewBox="0 0 112 112">'
      + '<circle cx="56" cy="56" r="44" fill="none" stroke="rgba(255,184,77,.22)" stroke-width="6"/>'
      + '<circle cx="56" cy="56" r="44" fill="none" stroke="'+col+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+Math.max(0.1,(C7*pct/100)).toFixed(1)+' '+C7.toFixed(1)+'" transform="rotate(-90 56 56)"/>'
      + '<circle cx="56" cy="12" r="4" fill="#fff"/>'
      + '<circle cx="56" cy="12" r="4" fill="#fff" transform="rotate('+deg7+' 56 56)"/></svg>'
      + reading(main, sub, isBal);
  }
  return '<div class="stage"><div class="ball '+skin.id+'">'+inner+'</div></div>';
}
var SKINS = [
  { id:'v1', accent:'#ff9f0a', title:'V1 · 余烬计时橙（候选 dark）', src:'深底 + 24 粒刻度圈 + 进度弧',
    verdict:['wrn','注意：V1 的橙色身份色恰好撞 warn 橙。41% 时弧用等级绿（语义优先），warn 以上才回到橙→红。能接受才用。'] },
  { id:'v3', accent:'#0a84ff', title:'V3 · 极速绿环（候选 dark-霓虹变体）', src:'双同心环 + 进度弧，外圈=进度',
    verdict:['okv','最干净的一款：语义全靠弧长度+弧色，皮肤只出底色。余额=蓝色满环+金额，一眼区分。'] },
  { id:'v5', accent:'#beff3c', title:'V5 · 柠檬分段环（候选 minimal-活力变体）', src:'粗分段环，进度弧压在分段轨道上',
    verdict:['okv','分段缺口在小尺寸下反而是刻度感。余额=满格柠檬黄+金额。'] },
  { id:'v6', accent:'#3f9dff', title:'V6 · 潮汐水位蓝（候选 aero，水体保留款）', src:'底部水体高度=进度（现有语义零改动）',
    verdict:['okv','唯一不用改任何语义映射的款：水高=用量、满水=余额、水色=等级色。余额读数压在水上，保证白字对比。'] },
  { id:'v7', accent:'#ffb84d', title:'V7 · 墨底琥珀弧（候选 ink，替代米色宣纸）', src:'深墨底 + 琥珀身份弧 + 弧开口两端白色端点',
    verdict:['okv','深盘让弧色（等级色）完全主导，两端白点把弧的开口钉死 —— 小尺寸下比分段环更精确。余额=琥珀满环+金额。端点是弧端点的"钉",不是装饰:它让用户在 41%/59% 这种接近值上也能看出方向。'] },
];
var STATES = [ {pct:41,tag:'用量'}, {pct:78,tag:'用量'}, {pct:92,tag:'用量'}, {bal:'¥1288'} ];
var LABS = [ ['41%','ok · 绿色'], ['78%','warn · 橙色'], ['92%','danger · 红色'], ['余额','满格+accent+金额'] ];
// 隐藏柱：液高=用量（70% warn 橙）/满柱=余额 accent；槽色按皮肤，刻度+侧光统一做法
var COLTRACK = { v1:'#1d1008', v3:'#0a1f14', v5:'#121a0c', v6:'#0a1424', v7:'#0a1020' };
var COLTICK = { v1:'rgba(255,200,120,.55)', v3:'rgba(160,255,200,.5)', v5:'rgba(230,255,170,.55)', v6:'rgba(200,225,255,.6)', v7:'rgba(200,215,255,.6)' };
function column(skin, st){
  var isBal = !!st.bal, pct = isBal ? 100 : st.pct;
  var col = isBal ? skin.accent : LVL[lvlOf(pct)];
  return '<div class="col" style="background:'+COLTRACK[skin.id]+';--tick:'+COLTICK[skin.id]+'">'
    + '<div class="cfill" style="height:'+pct+'%;background:linear-gradient(to bottom,'+col+'e6,'+col+' 45%,'+col+'99)"></div>'
    + '<div class="cticks"></div><div class="cgloss"></div></div>';
}
var html = '';
SKINS.forEach(function(sk){
  html += '<div class="sec"><h2>'+sk.title+'</h2><div class="src">'+sk.src+'</div><div class="balls">';
  STATES.forEach(function(st,i){
    html += '<div class="bcell">'+ball(sk,st)+'<div class="lab">'+LABS[i][0]+'<small>'+LABS[i][1]+'</small></div></div>';
  });
  html += '</div><div class="v '+sk.verdict[0]+'">'+sk.verdict[1]+'</div></div>';
});
document.getElementById('app').innerHTML = html;
// 隐藏柱区：每款皮肤一根 70% 用量柱 + 一根余额满柱（与球同源同色）
var colHtml = '<div class="sec"><h2>隐藏柱 · 五款皮肤（2x：24×112，左=70% 用量 warn 橙，右=余额满柱 accent）</h2>'
  + '<div class="src">液高=用量/满柱=余额、液色=等级色/ accent、槽色=皮肤；弯月+三刻度+管壁侧光统一做法</div><div class="balls">';
SKINS.forEach(function(sk){
  colHtml += '<div class="bcell">'+column(sk,{pct:70})+'<div class="lab">'+sk.id.toUpperCase()+' 70%<small>用量柱</small></div></div>';
  colHtml += '<div class="bcell">'+column(sk,{bal:'1'})+'<div class="lab">'+sk.id.toUpperCase()+' 满柱<small>余额 accent</small></div></div>';
});
document.getElementById('app').innerHTML += colHtml + '</div><div class="v okv">柱与球同源同色：70% 用量柱五款都是 warn 橙（语义优先），区别只在槽色；余额满柱各用自家 accent。立体感靠管壁左侧光 + 右侧内阴影 + 外投影。</div></div>';
// —— morph demo：V6 水球 + V3 环球（动效在浏览器打开 HTML 点按钮看；定帧见 morph-mid.png）——
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function demoBall(skin, pct){
  // 复用 ball()，包一层可位移的 .mball（transform 不污染 .ball 本体）
  return '<div class="mball ball '+skin.id+'">'
    + ballInner(skin, { pct:pct, tag:'用量' }, true) + '</div>';
}
function ballInner(skin, st, forMorph){
  var pct = st.pct, lv = lvlOf(pct), col = LVL[lv];
  var inner = '';
  if (skin.id==='v6'){
    inner = '<div class="wclip"><div class="water mwater" style="height:'+pct+'%;background:linear-gradient(to bottom,'+col+'e6,'+col+' 45%,'+col+'99)">'
      + waveSvg(col)
      + '</div></div><div class="gloss"></div><div class="rim"></div>'
      + reading(pct+'%', st.tag, false);
  } else if (skin.id==='v3'){
    inner = arc(48, pct, col, 5, 'rgba(34,181,115,.22)')
      + '<svg class="ring" viewBox="0 0 112 112"><circle cx="56" cy="56" r="38" fill="none" stroke="rgba(34,181,115,.16)" stroke-width="3"/></svg>'
      + reading(pct+'%', st.tag, false);
  }
  return inner;
}
function demoSection(skin, pct){
  var note = skin.id==='v6'
    ? '左=球，右=屏边柱位；点按钮播隐藏 / 唤出（隐藏三段≈1.4s：熔化→化浪→堆柱，唤出反向≈0.9s）'
    : '左=球，右=屏边柱位；点按钮播隐藏 / 唤出（隐藏≈530ms，唤出≈400ms）';
  var extra = '', ping = '';
  if (skin.id==='v6'){
    extra = '<div class="mwave"><svg viewBox="0 0 224 40" preserveAspectRatio="none">'
      + '<path d="M0,20 Q14,8 28,20 T56,20 T84,20 T112,20 T140,20 T168,20 T196,20 T224,20 V40 H0 Z"'
      + ' fill="rgba(255,159,10,.85)"/></svg></div>';
    ping = '<div class="mping"></div>';
  }
  return '<div class="sec"><h2> morph · '+skin.title+'（'+pct+'%）</h2>'
    + '<div class="src">'+note+'</div>'
    + '<div class="mstage" id="m-'+skin.id+'">' + demoBall(skin, pct) + extra
    + '<div class="mcol col" style="background:'+COLTRACK[skin.id]+';--tick:'+COLTICK[skin.id]+'">'
    + '<div class="cfill mfill" style="height:0%;background:'+LVL[lvlOf(pct)]+'"></div>'
    + '<div class="cticks"></div><div class="cgloss"></div>'+ping+'</div></div>'
    + '<div class="mbtns"><button onclick="demoHide(\''+skin.id+'\','+pct+')">播隐藏：球→柱</button>'
    + '<button onclick="demoReveal(\''+skin.id+'\','+pct+')">播唤出：柱→球</button></div></div>';
}
var SKIN_V6 = SKINS[3], SKIN_V3 = SKINS[1];
document.getElementById('app').innerHTML += demoSection(SKIN_V6, 70) + demoSection(SKIN_V3, 70);
function mEls(id){
  var root = document.getElementById('m-'+id);
  return { ball:root.querySelector('.mball'), water:root.querySelector('.mwater'),
    col:root.querySelector('.mcol'), fill:root.querySelector('.mfill'),
    wave:root.querySelector('.mwave'), ping:root.querySelector('.mping') };
}
async function demoHide(id, pct){
  if (id==='v6') return demoHideWater(mEls(id), pct);
  var e = mEls(id);
  e.ball.style.transition = 'transform 150ms ease-out';
  e.ball.style.transform = 'translateX(70px) scaleX(1.35) scaleY(.85)';
  if (e.water){ e.water.style.transition = 'height 150ms ease-in'; e.water.style.height = '15%'; }
  await sleep(170);
  e.ball.style.transition = 'transform 300ms cubic-bezier(.34,1.3,.64,1), opacity 200ms ease-out';
  e.ball.style.transform = 'translateX(196px) scale(.15)'; e.ball.style.opacity = '0';
  if (e.water){ e.water.style.transition = 'height 300ms ease-out'; e.water.style.height = '0%'; }
  e.col.style.transition = 'transform 300ms cubic-bezier(.34,1.56,.64,1), opacity 150ms';
  e.col.style.transform = 'scale(1)'; e.col.style.opacity = '1';
  e.fill.style.transition = 'height 300ms ease-out'; e.fill.style.height = pct+'%';
  await sleep(330);
  e.col.style.transition = 'transform 80ms ease-out'; e.col.style.transform = 'scale(1.05)';
  await sleep(100);
  e.col.style.transform = 'scale(1)';
}
async function demoReveal(id, pct){
  if (id==='v6') return demoRevealWater(mEls(id), pct);
  var e = mEls(id);
  e.col.style.transition = 'transform 180ms ease-in, opacity 180ms';
  e.col.style.transform = 'scale(.2)'; e.col.style.opacity = '0';
  e.fill.style.transition = 'height 180ms ease-in'; e.fill.style.height = '0%';
  e.ball.style.transition = 'transform 220ms cubic-bezier(.34,1.56,.64,1), opacity 150ms ease-out';
  e.ball.style.transform = 'translateX(0) scale(1)'; e.ball.style.opacity = '1';
  if (e.water){ e.water.style.transition = 'height 220ms ease-out 60ms'; e.water.style.height = pct+'%'; }
  await sleep(300);
}
// —— V6 水版三段 morph：熔化（晃+水涨顶）→ 化浪（球散成行进波带）→ 堆柱（波注入+液涨+浪花）——
async function demoHideWater(e, pct){
  var col = LVL[lvlOf(pct)];
  e.ball.style.transition = ''; e.ball.style.transform = ''; e.ball.style.opacity = '1';
  e.col.style.transform = 'scale(0)'; e.col.style.opacity = '0';
  e.fill.style.transition = 'none'; e.fill.style.height = '0%';
  e.wave.style.transition = 'none'; e.wave.style.transform = 'scaleX(0)'; e.wave.style.opacity = '0';
  // 1 熔化：球晃动、水涨到顶
  e.ball.animate([
    { transform:'translateX(0) rotate(0deg) scale(1,1)' },
    { transform:'translateX(8px) rotate(3deg) scale(1.06,.94)' },
    { transform:'translateX(-6px) rotate(-3deg) scale(.96,1.05)' },
    { transform:'translateX(10px) rotate(2deg) scale(1.08,.92)' }
  ], { duration:450, easing:'ease-in-out' });
  if (e.water){ e.water.style.transition = 'height 450ms ease-in'; e.water.style.height = '96%'; }
  await sleep(470);
  // 2 化浪：球体拉散消失，波带从左侧长出来向右行进
  e.ball.style.transition = 'none';
  var melt = e.ball.animate([
    { transform:'translateX(10px) scale(1.05,.95)', opacity:1 },
    { transform:'translateX(90px) scale(1.35,.45)', opacity:.55 },
    { transform:'translateX(150px) scale(1.5,.25)', opacity:0 }
  ], { duration:350, easing:'ease-in', fill:'forwards' });
  e.wave.style.transition = 'opacity 200ms, transform 350ms ease-out';
  e.wave.style.opacity = '1'; e.wave.style.transform = 'scaleX(1)';
  e.wave.classList.add('flow');
  await sleep(370);
  melt.commitStyles(); melt.cancel();
  e.ball.style.opacity = '0';
  // 3 堆柱：波带注入柱位，柱立起、液面带过冲涨起、浪尖炸一朵水花
  e.wave.style.transition = 'opacity 250ms ease-in, transform 250ms ease-in';
  e.wave.style.opacity = '0'; e.wave.style.transform = 'translateX(40px) scaleX(1)';
  e.col.style.transition = 'transform 350ms cubic-bezier(.34,1.56,.64,1), opacity 150ms';
  e.col.style.transform = 'scale(1)'; e.col.style.opacity = '1';
  e.fill.style.background = 'linear-gradient(to bottom,'+col+'e6,'+col+' 45%,'+col+'99)';
  var rise = e.fill.animate(
    [{ height:'0%' }, { height:(pct+12)+'%', offset:.6 }, { height:(pct-3)+'%', offset:.85 }, { height:pct+'%' }],
    { duration:520, easing:'ease-out', fill:'forwards' });
  await sleep(550);
  rise.commitStyles(); rise.cancel();
  e.wave.classList.remove('flow');
  if (e.ping){ e.ping.animate(
    [{ transform:'scale(.4)', opacity:.95 }, { transform:'scale(2.2)', opacity:0 }],
    { duration:450, easing:'ease-out' }); }
  e.col.style.transition = 'transform 100ms ease-out'; e.col.style.transform = 'scale(1.08)';
  await sleep(110);
  e.col.style.transition = 'transform 90ms ease-in-out'; e.col.style.transform = 'scale(1.03)';
  await sleep(100);
  e.col.style.transform = 'scale(1)';
}
async function demoRevealWater(e, pct){
  var col = LVL[lvlOf(pct)];
  // 1 泄柱：液面流光、柱子瘪掉
  e.fill.style.transition = 'none';
  var drain = e.fill.animate([{ height:pct+'%' }, { height:'0%' }], { duration:280, easing:'ease-in', fill:'forwards' });
  e.col.style.transition = 'transform 280ms ease-in, opacity 200ms';
  e.col.style.transform = 'scale(.6)'; e.col.style.opacity = '0';
  await sleep(300);
  drain.commitStyles(); drain.cancel();
  // 2 回浪：波带从柱位向球位倒流
  e.wave.style.transition = 'none';
  e.wave.style.transformOrigin = 'right center';
  e.wave.style.transform = 'translateX(40px) scaleX(1)'; e.wave.style.opacity = '0';
  void e.wave.offsetWidth;
  e.wave.style.transition = 'opacity 200ms, transform 300ms ease-out';
  e.wave.style.opacity = '1'; e.wave.style.transform = 'scaleX(1) translateX(0)';
  e.wave.classList.add('flow');
  await sleep(330);
  // 3 凝球：波带收拢处鼓起一颗水球，落定回弹
  e.wave.style.transition = 'opacity 200ms'; e.wave.style.opacity = '0';
  e.wave.classList.remove('flow');
  e.ball.style.transition = 'none'; e.ball.style.opacity = '1';
  var back = e.ball.animate([
    { transform:'translateX(150px) scale(1.4,.3)', opacity:.25 },
    { transform:'translateX(40px) scale(.9,1.1)', opacity:1 },
    { transform:'translateX(0) scale(1,1)', opacity:1 }
  ], { duration:380, easing:'cubic-bezier(.34,1.3,.64,1)', fill:'forwards' });
  if (e.water){ e.water.style.transition = 'height 300ms ease-out 80ms'; e.water.style.height = pct+'%'; }
  await sleep(400);
  back.commitStyles(); back.cancel();
  e.ball.style.transform = ''; e.ball.style.opacity = '1';
  e.wave.style.transformOrigin = 'left center';
}
// —— A · 柱顶浪常驻：四款振幅/速度不同（70% warn 橙，语义优先）——
var WAVES = {
  calm:{ d:'M0,11 Q12,7 24,11 T48,11 T72,11 T96,11 V18 H0 Z', dur:'2.6s' },
  mid:{ d:'M0,10 Q12,3 24,10 T48,10 T72,10 T96,10 V18 H0 Z', dur:'1.7s' },
  wild:{ d:'M0,9 Q12,0 24,9 T48,9 T72,9 T96,9 V18 H0 Z', dur:'1.1s' },
  /* V7 墨流：波幅最小、速度最慢 —— 墨在纸上的流动感，比 V3 的微澜还要平 */
  drift:{ d:'M0,11.5 Q12,9.5 24,11.5 T48,11.5 T72,11.5 T96,11.5 V18 H0 Z', dur:'4.2s' }
};
var ACOL = [
  { id:'v1', w:'mid', shim:'2.8s', lab:'V1 · 中浪' },
  { id:'v3', w:'calm', shim:'3.4s', lab:'V3 · 微澜慢速' },
  { id:'v5', w:'wild', shim:'1.8s', lab:'V5 · 急浪' },
  { id:'v6', w:'mid', shim:'2.4s', lab:'V6 · 中浪' },
  { id:'v7', w:'drift', shim:'3.8s', lab:'V7 · 墨流缓行' }
];
function acol(sk){
  var col = LVL.warn;
  return '<div class="bcell"><div class="col acol" style="background:'+COLTRACK[sk.id]+';--tick:'+COLTICK[sk.id]+'">'
    + '<div class="cfill" style="height:70%;background:linear-gradient(to bottom,'+col+'e6,'+col+' 45%,'+col+'99)">'
    + '<svg class="cwave" style="animation-duration:'+WAVES[sk.w].dur+'" viewBox="0 0 96 18" preserveAspectRatio="none"><path d="'+WAVES[sk.w].d+'" fill="'+col+'"/></svg>'
    + '</div><div class="cticks"></div>'
    + '<div class="cshim" style="animation-duration:'+sk.shim+'"></div>'
    + '<div class="cgloss"></div></div>'
    + '<div class="lab">'+sk.lab+'<small>柱顶浪常驻 + 液光流</small></div></div>';
}
document.getElementById('app').innerHTML += '<div class="sec"><h2>A · 柱顶浪常驻（hidden 只停球内三层，柱顶留一层）</h2>'
  + '<div class="src">五根 70% 用量柱 warn 橙，区别在柱顶波浪振幅/速度 + 柱内液光流速度。动效在浏览器看，截图只定得住一帧。</div>'
  + '<div class="balls">' + ACOL.map(acol).join('') + '</div>'
  + '<div class="v okv">零架构改动：hidden 下球内三层照停，只给柱顶留一层小波 + 液内高光漂移，耗电可忽略。振幅/速度按天气走。</div></div>';
// —— D · 悬停 peek：柱上停留冒完整波浪球，不唤出 ——
function pcol(sk){
  return '<div class="bcell pcol"><div class="peek"><div class="pk-ball">'
    + '<div class="pk-water">'
    + '<svg class="pk-w1" viewBox="0 0 224 16" preserveAspectRatio="none"><path d="M0,9 Q14,3 28,9 T56,9 T84,9 T112,9 T140,9 T168,9 T196,9 T224,9 V16 H0 Z" fill="#ff9f0a"/></svg>'
    + '<svg class="pk-w2" viewBox="0 0 224 16" preserveAspectRatio="none"><path d="M0,9 Q14,3 28,9 T56,9 T84,9 T112,9 T140,9 T168,9 T196,9 T224,9 V16 H0 Z" fill="#ffd9a0"/></svg>'
    + '</div><div class="pk-drops"><i></i><i></i><i></i></div>'
    + '<div class="pk-read">70%</div></div></div>'
    + '<div class="col" style="background:'+COLTRACK[sk.id]+';--tick:'+COLTICK[sk.id]+'">'
    + '<div class="cfill" style="height:70%;background:linear-gradient(to bottom,#ff9f0ae6,#ff9f0a 45%,#ff9f0a99)"></div>'
    + '<div class="cticks"></div><div class="cgloss"></div></div>'
    + '<div class="lab">'+sk.id.toUpperCase()+' 70%<small>悬停冒预览球</small></div></div>';
}
document.getElementById('app').innerHTML += '<div class="sec"><h2>D · 悬停 peek（柱上停留冒完整波浪预览，不唤出）</h2>'
  + '<div class="src">鼠标移到柱上：56px…(2x 112) 预览球淡入（双层行进波 + 落雨 + 读数），移开即散。动效在浏览器试，截图定不住悬停态。</div>'
  + '<div class="balls">' + ACOL.map(pcol).join('') + '</div>'
  + '<div class="v okv">想看细节有地方看：平时柱子只保液位+颜色+身份，波浪全貌收进 peek 气泡，不占常驻耗电。</div></div>';
document.querySelectorAll('.pcol').forEach(function(p){
  p.addEventListener('mouseenter', function(){
    document.querySelectorAll('.pcol.on').forEach(function(o){ o.classList.remove('on'); });
    p.classList.add('on');
  });
  p.addEventListener('mouseleave', function(){ p.classList.remove('on'); });
});
</script>
