appId: dev.zhouri.balancedeck
productName: BalanceDeck
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: build
    to: build
  # 真人系宠物素材（MIT，gitignored，dist 前由 predist 钩子拉取；缺失则构建失败并提示）
  - from: resources/human-pets
    to: human-pets
asar: true
mac:
  category: public.app-category.utilities
  identity: null
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
